repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: clang-c
      - id: check-yaml
  - repo: https://github.com/tekwizely/pre-commit-golang
    rev: v1.0.0-rc.4
    hooks:
      - id: go-fmt
      - id: go-imports
      - id: go-mod-tidy
      - id: go-test-mod
        args: [ "--hook:env:CGO_ENABLED=0" ]
      - id: my-cmd-mod
        name: golangci-lint
        args: [ "go", "tool", "-modfile=golangci-lint.mod", "golangci-lint", "run"]
